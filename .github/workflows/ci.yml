name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    name: Byte-compile (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # ყველა წყაროს სინტაქსის შემოწმება — მძიმე დამოკიდებულებების ინსტალაციის
      # გარეშე (compileall მხოლოდ ბაიტ-კომპილაციას აკეთებს, არ აიმპორტებს).
      - name: Byte-compile all sources
        run: python -m compileall -q gis_box.py tools

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # მხოლოდ მსუბუქი დამოკიდებულებები — სუფთა-ლოგიკის ტესტები (translit,
      # regions, export/format_xlsx). GIS/tkinter პაკეტები არ სჭირდება.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest openpyxl

      - name: Run tests
        run: python -m pytest -q

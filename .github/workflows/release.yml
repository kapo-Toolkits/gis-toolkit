name: Release

# `v*` ტეგზე — აწყობს დამოუკიდებელ ბილდებს და ურთავს GitHub Release-ს.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- Windows: standalone .exe (onedir → zip) ----------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller
          pip install -r requirements.txt

      - name: Build (PyInstaller)
        run: pyinstaller --clean --noconfirm gis_box.spec

      - name: Zip onedir
        run: Compress-Archive -Path dist/GIS_BOX/* -DestinationPath GIS_BOX-windows-x64.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: GIS_BOX-windows-x64.zip

  # ---------- Linux: tar.gz + deb + rpm + AppImage ----------
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgl1
          python -m pip install --upgrade pip pyinstaller
          pip install -r requirements.txt

      - name: Build (PyInstaller)
        run: pyinstaller --clean --noconfirm gis_box.spec

      - name: Tarball
        run: tar -C dist -czf GIS_BOX-linux-x64.tar.gz GIS_BOX

      - name: Version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package deb & rpm (nfpm)
        env:
          VERSION: ${{ steps.ver.outputs.version || '0.0.0' }}
        run: |
          curl -sSfL https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_amd64.deb -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
          nfpm package -f packaging/nfpm.yaml -p deb --target GIS_BOX-linux-x64.deb
          nfpm package -f packaging/nfpm.yaml -p rpm --target GIS_BOX-linux-x64.rpm

      - name: Build AppImage (best-effort)
        continue-on-error: true
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/GIS_BOX/* AppDir/usr/bin/
          cp gis_box.png AppDir/gis-box.png
          cat > AppDir/gis-box.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=GIS_BOX
          Exec=GIS_BOX
          Icon=gis-box
          Terminal=false
          Categories=Utility;Science;
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/GIS_BOX" "$@"
          EOF
          chmod +x AppDir/AppRun
          curl -sSfL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          /tmp/appimagetool --appimage-extract-and-run AppDir GIS_BOX-linux-x86_64.AppImage

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            GIS_BOX-linux-x64.tar.gz
            GIS_BOX-linux-x64.deb
            GIS_BOX-linux-x64.rpm
            GIS_BOX-linux-x86_64.AppImage
        # AppImage შესაძლოა არ შეიქმნას (best-effort) — action ცარიელ ფაილს გამოტოვებს
        continue-on-error: true
